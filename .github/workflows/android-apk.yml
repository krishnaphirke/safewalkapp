name: Build SafeWalk Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out SafeWalk
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install SafeWalk dependencies
        run: npm install --no-audit --no-fund

      - name: Install Capacitor Android
        run: npm install --no-audit --no-fund --no-save @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8

      - name: Build web assets
        run: npm run build

      - name: Create Android project
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.safewalk.app",
            "appName": "SafeWalk",
            "webDir": "dist"
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Compile APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SafeWalk-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
